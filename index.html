<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit - Calculation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <style>
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        main {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        input {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #6c6c6c;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            width: 200px;
            text-align: center;
            transition: transform 0.6s ease;
        }

        .card:hover {
            background-color: #8f8d8d;
            transform: scale(1.05);
        }

        .pinjaman-card {
            display: none;
            border: 1px solid #dfaaaa;
            border-radius: 5px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }

        .kredit-card {
            display: none;
            border: 1px solid #dfaaaa;
            border-radius: 5px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }

        .button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .button:hover {
            background-color: #45a049;
            transform: scale(1.1);
        }

        .back-home {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background-color: #4CAF50;
            color: white;
            border-radius: 50%;      
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .back-home:hover {
            background-color: #45a049;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h1>Finance Calculation</h1>

    <main>


        <section class="card" onclick="tampilkanForm('kredit')" id="kreditCard" >
            <div class="card-body">
                <i class="fa-solid fa-car"></i>
                <h2>Simulasi Kredit</h2>
            </div>
        </section>

        <section class="card" onclick="tampilkanForm('pinjaman')" id="pinjamanCard">
            <div class="card-body">
                <i class="fa-solid fa-money-bill"></i>
                <h2>Simulasi Pinjaman</h2>
            </div>
        </section>

        <div id="kreditForm" class="kredit-card">
            <h2>Simulasi Kredit</h2>
            <form onsubmit="event.preventDefault(); menjalankanKreditSimulasi();">
                <label for="harga">Harga Properti/Kendaraan (Rp):</label>
                <input type="number" id="harga" required><br><br>

                <label for="dp">Uang Muka / DP (Rp):</label>
                <input type="number" id="dp" required><br><br>

                <label for="suku_bunga_kredit">Suku Bunga Tahunan (%):</label>
                <input type="number" step="0.01" id="suku_bunga_kredit" required><br><br>

                <label for="tenor_kredit">Tenor Pinjaman (Tahun):</label>
                <input type="number" id="tenor_kredit" required><br><br>

                <button type="submit" class="button">Hitung Kredit</button>
            </form>
        </div>

        <div id="pinjamanForm" class="pinjaman-card">
            <h2>Simulasi Pinjaman</h2>
            <form onsubmit="event.preventDefault(); menjalankanPinjamanSimulasi();">
                <label for="jumlah_pinjaman">Jumlah Pinjaman (Rp):</label>
                <input type="number" id="jumlah_pinjaman" required><br><br>

                <label for="suku_bunga_pinjaman">Suku Bunga Tahunan (%):</label>
                <input type="number" step="0.01" id="suku_bunga_pinjaman" required><br><br>

                <label for="tenor_pinjaman">Tenor Pinjaman (Tahun):</label>
                <input type="number" id="tenor_pinjaman" required><br><br>

                <button type="submit" class="button">Hitung Pinjaman</button>
                
            </form>
        </div>

        <div id="hasilSimulasi" style="margin-top: 20px; font-weight: bold;"></div>

        <a href="index.html" class="back-home" title="Kembali ke Beranda" id="home">
            <i class="fa-solid fa-house"></i>
        </a>

    </main>


    
    <script>
        // Fungsi untuk menampilkan form secara bergantian
        function tampilkanForm(jenis) {  
            document.getElementById('kreditCard').style.display = 'none';
            document.getElementById('pinjamanCard').style.display = 'none';
            document.getElementById('hasilSimulasi').innerHTML = ''; 

            if (jenis === 'kredit') {
                document.getElementById('kreditForm').style.display = 'block';
                document.getElementById('home').style.display = 'flex';
            } 
            else if (jenis === 'pinjaman') {
                document.getElementById('pinjamanForm').style.display = 'block';
                document.getElementById('home').style.display = 'flex';
            }
        }

        // --- FUNGSI LOGIKA FINANSIAL ---
        function hitungPinjaman(harga, dp) {
            return harga - dp;
        }

        // Perbaikan typo parameter: tenor_tahun -> tenorTahun
        function hitungBunga(pinjaman, suku_bunga, tenorTahun) {
            return pinjaman * (suku_bunga / 100) * tenorTahun;
        }

        function hitungCicilanPerBulan(pinjaman, bunga, tenorTahun) {
            let totalUtang = pinjaman + bunga;
            let totalBulan = tenorTahun * 12;
            return totalUtang / totalBulan;
        }

        function hitungTotalAngsuran(cicilanBulanan, tenorTahun) {
            let totalBulan = tenorTahun * 12;
            return cicilanBulanan * totalBulan;
        }

        // --- FUNGSI EKSEKUSI UNTUK FORM KREDIT ---
        function menjalankanKreditSimulasi() {
            let harga = Number(document.getElementById("harga").value);
            let dp = Number(document.getElementById("dp").value);
            let sukuBunga = Number(document.getElementById("suku_bunga_kredit").value);
            let tenorTahun = Number(document.getElementById("tenor_kredit").value);

            let totalPinjaman = hitungPinjaman(harga, dp);
            let totalBunga = hitungBunga(totalPinjaman, sukuBunga, tenorTahun);
            let cicilanBulanan = hitungCicilanPerBulan(totalPinjaman, totalBunga, tenorTahun);
            let totalBayar = hitungTotalAngsuran(cicilanBulanan, tenorTahun);

            document.getElementById("hasilSimulasi").innerHTML = `
                <h3>=== HASIL SIMULASI KREDIT ===</h3>
                <p>Total Pinjaman : Rp ${totalPinjaman.toLocaleString('id-ID')}</p>
                <p>Total Bunga : Rp ${totalBunga.toLocaleString('id-ID')}</p>
                <p>Angsuran per Bulan : Rp ${cicilanBulanan.toLocaleString('id-ID', {maximumFractionDigits: 2})}</p>
                <p>Total Angsuran : Rp ${totalBayar.toLocaleString('id-ID')}</p>
            `;
        }

        // --- FUNGSI EKSEKUSI UNTUK FORM PINJAMAN ---
        function menjalankanPinjamanSimulasi() {
            let jumlahPinjaman = Number(document.getElementById("jumlah_pinjaman").value);
            let sukuBunga = Number(document.getElementById("suku_bunga_pinjaman").value);
            let tenorTahun = Number(document.getElementById("tenor_pinjaman").value);

            let totalBunga = hitungBunga(jumlahPinjaman, sukuBunga, tenorTahun);
            let cicilanBulanan = hitungCicilanPerBulan(jumlahPinjaman, totalBunga, tenorTahun);
            let totalBayar = hitungTotalAngsuran(cicilanBulanan, tenorTahun);

            document.getElementById("hasilSimulasi").innerHTML = `
                <h3>=== HASIL SIMULASI PINJAMAN ===</h3>
                <p>Jumlah Pinjaman : Rp ${jumlahPinjaman.toLocaleString('id-ID')}</p>
                <p>Total Bunga : Rp ${totalBunga.toLocaleString('id-ID')}</p>
                <p>Angsuran per Bulan : Rp ${cicilanBulanan.toLocaleString('id-ID', {maximumFractionDigits: 2})}</p>
                <p>Total Bayar : Rp ${totalBayar.toLocaleString('id-ID')}</p>
            `;
        }
    </script>
    
</body>
</html>
