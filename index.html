<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit - Calculation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="logic.js"></script>
    
</head>
<body>

    <h1>Finance Calculation</h1>

    <main>


        <section class="card" onclick="tampilkanForm('kredit')" id="kreditCard" >
            <div class="card-body">
                <i class="fa-solid fa-car"></i>
                <h2>Simulasi Kredit</h2>
            </div>
        </section>

        <section class="card" onclick="tampilkanForm('pinjaman')" id="pinjamanCard">
            <div class="card-body">
                <i class="fa-solid fa-money-bill"></i>
                <h2>Simulasi Pinjaman</h2>
            </div>
        </section>

        <div id="kreditForm" class="kredit-card">
            <h2>Simulasi Kredit</h2>
            <form onsubmit="event.preventDefault(); menjalankanKreditSimulasi();">
                <label for="harga">Harga Properti/Kendaraan (Rp):</label>
                <input type="number" id="harga" required><br><br>

                <label for="dp">Uang Muka / DP (Rp):</label>
                <input type="number" id="dp" required><br><br>

                <label for="suku_bunga_kredit">Suku Bunga Tahunan (%):</label>
                <input type="number" step="0.01" id="suku_bunga_kredit" required><br><br>

                <label for="tenor_kredit">Tenor Pinjaman (Tahun):</label>
                <input type="number" id="tenor_kredit" required><br><br>

                <button type="submit" class="button">Hitung Kredit</button>
            </form>
        </div>

        <div id="pinjamanForm" class="pinjaman-card">
            <h2>Simulasi Pinjaman</h2>
            <form onsubmit="event.preventDefault(); menjalankanPinjamanSimulasi();">
                <label for="jumlah_pinjaman">Jumlah Pinjaman (Rp):</label>
                <input type="number" id="jumlah_pinjaman" required><br><br>

                <label for="suku_bunga_pinjaman">Suku Bunga Tahunan (%):</label>
                <input type="number" step="0.01" id="suku_bunga_pinjaman" required><br><br>

                <label for="tenor_pinjaman">Tenor Pinjaman (Tahun):</label>
                <input type="number" id="tenor_pinjaman" required><br><br>

                <button type="submit" class="button">Hitung Pinjaman</button>
                
            </form>
        </div>

       
        <a href="index.html" class="back-home" title="Kembali ke Beranda" id="home">
            <i class="fa-solid fa-house"></i>
        </a>

    </main>

    <div class="hasil-card" id="hasilSimulasi" style="margin-top: 20px; font-weight: bold;"></div>


    
</body>
</html>
